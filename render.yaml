# Render Blueprint: hosts the json-server REST API (server/db.json) for the production build.
# Data resets to db.json whenever the free instance restarts.
services:
  - type: web
    name: kanban-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/start-api.mjs
    envVars:
      - key: HOST
        value: 0.0.0.0
