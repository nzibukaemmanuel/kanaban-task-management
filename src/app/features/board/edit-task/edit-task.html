@if (task(); as t) {
  <div class="page-header">
    <h2>Edit task</h2>
  </div>

  <app-task-form
    [initialTask]="t"
    [existingTitles]="existingTitles()"
    submitLabel="Save changes"
    (save)="onSave($event)"
    (cancel)="onCancel()"
  />
} @else {
  <p class="empty-state">Task not found.</p>
  <button type="button" class="btn-secondary" (click)="goToBoard()">&larr; Back to board</button>
}
