<div class="board-page">
  <app-board-sidebar />

  <div class="board-page__content">
    <div class="page-header">
      <h1>Boards</h1>
      <p>Select a board to view its details.</p>
    </div>

    <label class="quick-jump">
      Quick jump:
      <app-select-field
        [options]="boardOptions"
        value=""
        ariaLabel="Quick jump to a board"
        (valueChange)="jumpToBoard($event)"
      />
    </label>

    <ul class="board-list">
      @for (boardId of boardIds; track boardId) {
        <li>
          <a class="board-card" [routerLink]="['/boards', boardId]">
            <span class="board-card__name">{{ boardId }}</span>
            <span class="task-count-badge">{{ taskCount$(boardId) | async }} tasks</span>
            <span class="board-card__arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
      }
    </ul>
  </div>
</div>
