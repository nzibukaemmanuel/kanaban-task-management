<div class="select-field" [class.open]="isOpen()">
  <button
    type="button"
    class="select-trigger"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="isOpen() ? activeOptionId() : null"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [attr.aria-required]="ariaRequired()"
    [attr.aria-invalid]="ariaInvalid()"
    [attr.aria-describedby]="ariaDescribedby()"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="select-trigger__label">{{ selectedLabel() }}</span>
    <svg
      class="select-trigger__chevron"
      width="12"
      height="8"
      viewBox="0 0 12 8"
      fill="none"
      aria-hidden="true"
    >
      <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (isOpen()) {
    <ul class="select-listbox" role="listbox" [id]="listboxId" [attr.aria-label]="ariaLabel()">
      @for (option of options(); track option.value) {
        <li
          role="option"
          [id]="optionId(option.value)"
          [attr.aria-selected]="option.value === value()"
          class="select-option"
          [class.active]="option.value === (activeValue() ?? value())"
          [class.selected]="option.value === value()"
          (click)="selectOption(option.value)"
          (mouseenter)="activeValue.set(option.value)"
        >
          {{ option.label }}
        </li>
      }
    </ul>
  }
</div>
