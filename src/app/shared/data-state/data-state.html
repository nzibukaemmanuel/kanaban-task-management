@if (error(); as message) {
  <div class="data-state data-state--error" role="alert">
    <p>{{ message }}</p>
    <button type="button" (click)="retry.emit()">Try again</button>
  </div>
} @else {
  <div class="data-state" role="status" aria-live="polite">
    <span class="data-state__spinner" aria-hidden="true"></span>
    <p>{{ loadingLabel() }}</p>
  </div>
}
